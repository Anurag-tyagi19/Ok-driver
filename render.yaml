# ==============================================================
# Render Blueprint Specification (Infrastructure as Code)
# OkDriver CCTV Intelligence Platform
# ==============================================================

services:
  # ------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ------------------------------------------------------------
  - type: web
    name: okdriver-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: okdriver-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # ------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ------------------------------------------------------------
  - type: web
    name: okdriver-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: okdriver-backend
          property: host

# ------------------------------------------------------------
# 3. PostgreSQL Managed Database
# ------------------------------------------------------------
databases:
  - name: okdriver-db
    databaseName: okdriver
    user: okdriver_user
    plan: free
    region: oregon
