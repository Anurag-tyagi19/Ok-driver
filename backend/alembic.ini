# ==============================================================
# Alembic Configuration
# ==============================================================
# Yeh file backend/ folder ke andar hona chahiye.
# Run karo: cd backend && alembic upgrade head
# ==============================================================

[alembic]
# Alembic migrations folder (backend/alembic/ folder)
script_location = alembic

# Database URL env.py mein load hogi (.env se)
sqlalchemy.url =

# Prepend current directory to Python path
prepend_sys_path = .


[post_write_hooks]
# Koi post-write hooks nahi hain


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
