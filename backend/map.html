<!DOCTYPE html>
<html>
<head>
    <title>OkDriver Camera Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>

<h2>OkDriver Camera Map</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView(
    [28.6139, 77.2090],
    12
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


async function loadCameras() {

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/api/v1/cameras/"
        );

        console.log("API status:", response.status);

        const cameras = await response.json();

        console.log("Cameras received:", cameras);

        cameras.forEach(camera => {

            console.log(
                "Adding camera:",
                camera.name,
                camera.latitude,
                camera.longitude
            );

            const marker = L.marker([
                camera.latitude,
                camera.longitude
            ]).addTo(map);

            marker.bindPopup(`
                <b>${camera.name}</b><br>
                Camera ID: ${camera.camera_code}<br>
                Status: ${camera.status}<br>
                Zone: ${camera.zone || "N/A"}
            `);

        });

    } catch (error) {

        console.error("Error loading cameras:", error);

    }
}

loadCameras();
</script>

</body>
</html>
